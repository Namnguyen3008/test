name: VMEC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff format --check src tests services vmec_data apps migrations scripts
      - run: ruff check src tests services vmec_data apps migrations scripts
      - run: mypy src services vmec_data apps --ignore-missing-imports
      - run: pytest -q
        env: { APP_ENV: test }
      - run: pip check

  persistent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vmec
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vmec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vmec
      VMEC_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vmec
      VMEC_TEST_REDIS_URL: redis://localhost:6379/14
      REDIS_URL: redis://localhost:6379/13
      SESSION_REDIS_URL: redis://localhost:6379/14
      CSRF_SECRET: ci-only-csrf-secret-at-least-32-characters
      RETRIEVAL_RUNTIME_MODE: postgres
      VMEC_PERSISTENT_PGVECTOR_VERIFIED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest tests/integration -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    needs: [python, web, persistent-contract]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vmec-api:test .
      - run: docker build -t vmec-web:test apps/web
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: vmec-api:test
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
