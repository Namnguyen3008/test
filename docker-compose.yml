name: vmec-01

x-runtime: &runtime
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt: [no-new-privileges:true]

x-backend-environment: &backend-environment
  APP_ENV: development
  APP_DATA_MODE: development
  REDIS_URL: redis://redis:6379/0
  SESSION_REDIS_URL: redis://redis:6379/1
  RETRIEVAL_RUNTIME_MODE: postgres
  VMEC_PERSISTENT_PGVECTOR_VERIFIED: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vmec
      POSTGRES_USER: vmec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the ignored V8 runtime env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vmec -d vmec"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redis_data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *runtime
    restart: "no"
    build: { context: ., dockerfile: Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://vmec:vmec@postgres:5432/vmec}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *runtime
    build: { context: ., dockerfile: Dockerfile }
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-environment
      DATABASE_URL: ${API_DATABASE_URL:?set API_DATABASE_URL to a vmec_api member login}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
      - reports:/app/data/reports
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      provision-roles: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *runtime
    build: { context: ., dockerfile: Dockerfile }
    command: ["python", "-m", "apps.worker"]
    environment:
      <<: *backend-environment
      DATABASE_URL: ${WORKER_DATABASE_URL:?set WORKER_DATABASE_URL to a vmec_worker member login}
    volumes:
      - ./data:/app/data:ro
      - reports:/app/data/reports
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      provision-roles: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    <<: *runtime
    healthcheck:
      disable: true
    build: { context: ., dockerfile: Dockerfile }
    command:
      ["celery", "-A", "apps.worker.__main__:app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-environment
      DATABASE_URL: ${WORKER_DATABASE_URL:?set WORKER_DATABASE_URL to a vmec_worker member login}
    volumes:
      - ./data:/app/data:ro
      - reports:/app/data/reports
    depends_on:
      migrate: { condition: service_completed_successfully }
      provision-roles: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  provision-roles:
    <<: *runtime
    restart: "no"
    build: { context: ., dockerfile: Dockerfile }
    command: ["python", "-m", "scripts.provision_local_postgres_roles"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in the ignored V8 runtime env file}
      VMEC_MIGRATION_DATABASE_URL: ${VMEC_MIGRATION_DATABASE_URL:?set VMEC_MIGRATION_DATABASE_URL in the ignored V8 runtime env file}
      VMEC_API_DATABASE_URL: ${VMEC_API_DATABASE_URL:?set VMEC_API_DATABASE_URL in the ignored V8 runtime env file}
      VMEC_WORKER_DATABASE_URL: ${VMEC_WORKER_DATABASE_URL:?set VMEC_WORKER_DATABASE_URL in the ignored V8 runtime env file}
      VMEC_IMPORTER_DATABASE_URL: ${VMEC_IMPORTER_DATABASE_URL:?set VMEC_IMPORTER_DATABASE_URL in the ignored V8 runtime env file}
      VMEC_ANALYTICS_DATABASE_URL: ${VMEC_ANALYTICS_DATABASE_URL:?set VMEC_ANALYTICS_DATABASE_URL in the ignored V8 runtime env file}
      VMEC_CLINICAL_DATABASE_URL: ${VMEC_CLINICAL_DATABASE_URL:?set VMEC_CLINICAL_DATABASE_URL in the ignored V8 runtime env file}
      GOVERNANCE_DATABASE_URL: ${GOVERNANCE_DATABASE_URL:?set GOVERNANCE_DATABASE_URL in the ignored V8 runtime env file}
      VMEC_BACKUP_DATABASE_URL: ${VMEC_BACKUP_DATABASE_URL:?set VMEC_BACKUP_DATABASE_URL in the ignored V8 runtime env file}
    depends_on:
      migrate: { condition: service_completed_successfully }

  governance-promote:
    <<: *runtime
    restart: "no"
    profiles: [governance]
    build: { context: ., dockerfile: Dockerfile }
    command:
      ["python", "-m", "scripts.governance_bridge", "promote", "--receipt-output", "/app/data/reports/vmec-production-v1.json"]
    environment:
      VMEC_ALLOW_GOVERNANCE_PROMOTION: "true"
      VMEC_GOVERNANCE_MANIFEST_PATH: /run/governance/manifest.json
      VMEC_GOVERNANCE_PUBLIC_KEY_PATH: /run/governance/trust-registry.json
      VMEC_GOVERNANCE_EVIDENCE_PATH: /run/governance/evidence.json
      VMEC_GOVERNANCE_RECEIPT_SIGNING_KEY_PATH: /run/governance/receipt-private-key.txt
      GOVERNANCE_DATABASE_URL: ${GOVERNANCE_DATABASE_URL:-}
    volumes:
      - ${VMEC_GOVERNANCE_ARTIFACT_DIR:-./data/governance/runtime}:/run/governance:ro
      - reports:/app/data/reports
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *runtime
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  reports:
