apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: vmec-api }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: vmec, app.kubernetes.io/component: api } } }
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: vmec-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: vmec-api }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPU }} } } }]
{{- end }}
