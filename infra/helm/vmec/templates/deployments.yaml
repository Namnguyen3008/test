{{- range $name := list "api" "web" "worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "vmec.name" $ }}-{{ $name }} }
spec:
  replicas: {{ $.Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "vmec.name" $ }}, app.kubernetes.io/component: {{ $name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "vmec.name" $ }}, app.kubernetes.io/component: {{ $name }} } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $name }}
          image: "{{ (index $.Values.images $name).repository }}:{{ (index $.Values.images $name).tag }}"
          {{- if eq $name "worker" }}
          command: ["python", "-m", "apps.worker"]
          {{- end }}
          ports: [{ name: http, containerPort: {{ if eq $name "web" }}3000{{ else }}8000{{ end }} }]
          env:
            - { name: APP_ENV, value: {{ $.Values.config.appEnv | quote }} }
            - { name: APP_DATA_MODE, value: {{ $.Values.config.dataMode | quote }} }
            {{- if ne $name "web" }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $.Values.config.databaseUrlSecret }}, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: {{ $.Values.config.redisUrlSecret }}, key: redis-url } }
            {{- end }}
            {{- if eq $name "api" }}
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $.Values.config.geminiKeySecret }}, key: api-key } }
            {{- end }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{ toYaml $.Values.resources | nindent 12 }}
          {{- if ne $name "worker" }}
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5 }
          {{- end }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
