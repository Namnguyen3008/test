apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vmec.name" . }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "vmec.name" . }}, app.kubernetes.io/component: migrate } }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          command: ["alembic", "upgrade", "head"]
          env:
            - { name: APP_ENV, value: {{ .Values.config.appEnv | quote }} }
            - { name: APP_DATA_MODE, value: {{ .Values.config.dataMode | quote }} }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.config.migrationDatabaseUrlSecret }}, key: database-url } }
            - name: SESSION_REDIS_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.config.redisUrlSecret }}, key: session-redis-url } }
            - name: CSRF_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.config.applicationSecret }}, key: csrf-secret } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
