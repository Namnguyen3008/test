replicaCount: 2
images:
  api: { repository: vmec/api, tag: latest }
  web: { repository: vmec/web, tag: latest }
  worker: { repository: vmec/api, tag: latest }
config:
  appEnv: production
  dataMode: production
  publicApiUrl: https://api.vmec.example.invalid
  corsOrigins: https://vmec.example.invalid
  emergencyReleaseId: vmec-production-v1
  databaseUrlSecret: vmec-runtime
  redisUrlSecret: vmec-runtime
  applicationSecret: vmec-application
  geminiKeySecret: vmec-gemini
runtimeData:
  # Pre-provision this read-only claim with the approved manifest and compiled catalog.
  existingClaim: vmec-runtime-data
ingress:
  enabled: false
  className: nginx
  host: vmec.example.invalid
  apiHost: api.vmec.example.invalid
  tlsSecret: vmec-staging-tls
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 1000m, memory: 1Gi }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPU: 70 }
